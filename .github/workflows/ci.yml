name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # windows runner: path/encoding behaviors under test are Windows-specific
    # (drive letters, backslash joins, GB18030 detection).
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mdview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mdview/frontend/package-lock.json

      - name: Frontend typecheck + build
        working-directory: mdview/frontend
        run: |
          npm ci
          npm run build

      # go:embed all:frontend/dist requires dist to exist, so the frontend
      # must be built before Go compiles.
      - name: Go vet + test
        run: |
          go vet ./...
          go test ./...

      - name: Render pipeline test
        working-directory: mdview/frontend
        run: npx tsx test-pipeline.ts
