<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #1f2733; font-family: sans-serif; }
  .wrap { padding: 30px; color: #cfd6e4; }
  .row { display: flex; align-items: center; gap: 24px; margin: 18px 0; }
  img { display: block; }
  .cap { font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h2>深色背景透明角验证（任务栏同款底色）</h2>
  <div class="row"><img src="build/icon-src/icon-256.png" width="256" height="256"><span class="cap">256px</span></div>
  <div class="row"><img src="build/icon-src/icon-48.png" width="48" height="48"><img src="build/icon-src/icon-32.png" width="32" height="32"><img src="build/icon-src/icon-16.png" width="16" height="16"><span class="cap">48 / 32 / 16 px</span></div>
  <div class="row"><img src="build/appicon.png" width="200" height="200"><span class="cap">1024 主图标（缩放显示）</span></div>
</div>
</body>
</html>
